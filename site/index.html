<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spoiler-Free Scores</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="modulepreload" href="espn.js">
<link rel="preload" href="sports.json" as="fetch" crossorigin>
<meta name="theme-color" content="#002E5D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spoiler-Free Scores">
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0 auto;
    max-width: 480px;
    padding: 20px 16px 40px;
    background: #ffffff;
    color: #111111;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0b0b0b; color: #eaeaea; }
    .game { background: #1a1a1a; border-color: #2a2a2a; }
    .meta { color: #9a9a9a; }
    .badge.upcoming, .badge.tie { background: #333; color: #ddd; }
  }
  /* The team picker doubles as the page heading: "BYU Football ⌄". The
     visible text is a span; a transparent <select> covers it, so a tap
     opens the phone's native picker while the heading sizes to its text. */
  .picker {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    max-width: calc(100% + 10px);
    box-sizing: border-box;
    margin: 0 0 4px -10px; /* text lines up with the list below */
    padding: 4px 12px 4px 10px;
    border: 1px solid transparent;
    border-radius: 8px;
    font-size: 1.3rem;
  }
  .picker-label {
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .picker::after {
    /* chevron, drawn in the text color so it works in dark mode */
    content: "";
    flex-shrink: 0;
    width: 7px;
    height: 7px;
    margin-bottom: 5px;
    border-right: 2.5px solid currentColor;
    border-bottom: 2.5px solid currentColor;
    transform: rotate(45deg);
  }
  .picker select {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    font-size: 16px; /* below 16px, iOS zooms the page on tap */
  }
  .picker:hover, .picker:focus-within { background: #f0f0f0; border-color: #e0e0e0; }
  @media (prefers-color-scheme: dark) {
    .picker:hover, .picker:focus-within { background: #1a1a1a; border-color: #2a2a2a; }
  }
  .subtitle {
    font-size: 0.85rem;
    color: #777;
    margin: 0 0 20px;
  }
  .game {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    margin-bottom: 8px;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
  }
  .info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .opponent {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta { font-size: 0.85rem; color: #666; }
  .badge {
    flex-shrink: 0;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 6px 14px;
    border-radius: 999px;
  }
  .badge.win { background: #1c7c3c; color: white; }
  .badge.loss { background: #b3261e; color: white; }
  .badge.live { background: #d97706; color: white; }
  .badge.upcoming, .badge.tie { background: #e5e5e5; color: #333; }
  .status { font-size: 0.9rem; color: #777; margin: 0 0 12px; }
  .status:empty { display: none; }
</style>
</head>
<body>
  <h1 class="picker"><span class="picker-label" aria-hidden="true">&nbsp;</span><select aria-label="Team"></select></h1>
  <p class="subtitle">Spoiler-free results — wins and losses only</p>
  <p class="status" role="status">Loading…</p>
  <div id="games"></div>
  <noscript>This page needs JavaScript to load the schedule.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
