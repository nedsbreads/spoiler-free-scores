<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spoiler-Free Scores</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="favicon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="modulepreload" href="espn.js?v=__VERSION__">
<link rel="preload" href="sports.json?v=__VERSION__" as="fetch" crossorigin>
<meta name="theme-color" content="#002E5D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spoiler-Free Scores">
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0 auto;
    max-width: 480px;
    padding: 12px 16px 40px; /* + the top bar's 8px = 20px above the heading */
    background: #ffffff;
    color: #111111;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0b0b0b; color: #eaeaea; }
    .game { background: #1a1a1a; border-color: #2a2a2a; }
    .meta { color: #9a9a9a; }
    .badge.upcoming, .badge.tie { background: #333; color: #ddd; }
  }
  /* Keeps the team picker on screen while the list scrolls. Spans the
     full width (cancelling the body's side padding) so rows slide under
     it cleanly; the divider shows only once something is underneath. */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 1;
    margin: 0 -16px;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 4px;
    background: #ffffff;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s;
  }
  .topbar.stuck { border-bottom-color: #e0e0e0; }
  @media (prefers-color-scheme: dark) {
    .topbar { background: #0b0b0b; }
    .topbar.stuck { border-bottom-color: #2a2a2a; }
  }
  /* The team picker doubles as the page heading: "[logo] BYU Football ⌄".
     It's a custom menu rather than a <select>, because native pickers
     (e.g. the iPhone's wheel) can only show text, not logos. */
  .picker-heading { margin: 0; font-size: 1.3rem; }
  .picker {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    max-width: calc(100% + 8px);
    box-sizing: border-box;
    margin: 0 0 0 -8px; /* logo lines up with the list below */
    padding: 4px 12px 4px 8px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .picker-label {
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .picker::after {
    /* chevron, drawn in the text color so it works in dark mode */
    content: "";
    flex-shrink: 0;
    width: 7px;
    height: 7px;
    margin-bottom: 5px;
    border-right: 2.5px solid currentColor;
    border-bottom: 2.5px solid currentColor;
    transform: rotate(45deg);
    transition: transform 0.15s;
  }
  .picker[aria-expanded="true"]::after { transform: translateY(4px) rotate(-135deg); }
  .picker:hover, .picker:focus-visible, .picker[aria-expanded="true"] {
    background: #f0f0f0;
    border-color: #e0e0e0;
    outline: none;
  }
  .logo-slot, .menu picture { display: flex; flex-shrink: 0; }
  .logo { width: 28px; height: 28px; object-fit: contain; }
  .menu {
    position: absolute;
    top: calc(100% - 2px);
    left: 8px;
    min-width: 250px;
    max-width: calc(100% - 16px);
    box-sizing: border-box;
    margin: 0;
    padding: 6px;
    list-style: none;
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    z-index: 2;
  }
  .menu[hidden] { display: none; }
  .menu li {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 44px; /* comfortable tap target */
    box-sizing: border-box;
    padding: 6px 12px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .menu li:hover, .menu li:focus-visible { background: #f0f0f0; }
  .menu li[aria-selected="true"] { background: #e8eef7; }
  .menu li[aria-selected="true"]::after {
    /* checkmark */
    content: "";
    width: 6px;
    height: 12px;
    margin: 0 4px 3px auto;
    border-right: 2.5px solid #002E5D;
    border-bottom: 2.5px solid #002E5D;
    transform: rotate(45deg);
  }
  @media (prefers-color-scheme: dark) {
    .picker:hover, .picker:focus-visible, .picker[aria-expanded="true"] {
      background: #1a1a1a;
      border-color: #2a2a2a;
    }
    .menu { background: #1a1a1a; border-color: #2a2a2a; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); }
    .menu li:hover, .menu li:focus-visible { background: #262626; }
    .menu li[aria-selected="true"] { background: #1f2f45; }
    .menu li[aria-selected="true"]::after { border-color: #9cc0ee; }
  }
  .subtitle {
    font-size: 0.85rem;
    color: #777;
    margin: 0 0 20px;
  }
  .game {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    margin-bottom: 8px;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
  }
  .info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .opponent {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta { font-size: 0.85rem; color: #666; }
  .badge {
    flex-shrink: 0;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 6px 14px;
    border-radius: 999px;
  }
  .badge.win { background: #1c7c3c; color: white; }
  .badge.loss { background: #b3261e; color: white; }
  .badge.live { background: #d97706; color: white; }
  .badge.upcoming, .badge.tie { background: #e5e5e5; color: #333; }
  .status { font-size: 0.9rem; color: #777; margin: 0 0 12px; }
  .status:empty { display: none; }
</style>
</head>
<body>
  <header class="topbar">
    <h1 class="picker-heading">
      <button class="picker" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="team-menu">
        <span class="logo-slot"></span><span class="picker-label">&nbsp;</span>
      </button>
    </h1>
    <ul id="team-menu" class="menu" role="listbox" aria-label="Team" hidden></ul>
  </header>
  <p class="subtitle">Spoiler-free results — wins and losses only</p>
  <p class="status" role="status">Loading…</p>
  <div id="games"></div>
  <noscript>This page needs JavaScript to load the schedule.</noscript>
  <script type="module" src="app.js?v=__VERSION__"></script>
</body>
</html>
