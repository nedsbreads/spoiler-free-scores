name: Deploy site to GitHub Pages

# Publishes site/ as-is (no build step). Only runs when site/ changes, so
# the notifier's frequent state commits don't trigger redeploys.
on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Browsers may reuse files for up to 10 min (Pages' max-age=600). A
      # new index.html loading a cached old app.js broke the page, so every
      # script/data URL carries this deploy's commit: a new page always
      # fetches matching files.
      - name: Stamp asset versions
        run: |
          sed -i "s/__VERSION__/${GITHUB_SHA::12}/g" site/index.html site/app.js
          if grep -q "__VERSION__" site/index.html site/app.js; then exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
